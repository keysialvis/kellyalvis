<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/contacto.css">
    <!-- enlace para los iconos de redes sociales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<title>Contáctanos</title>
</head>

<body>
    <header>
        <nav class="nav">
            <a href="index.html">Inicio</a>
            <a href="#">Nosotros</a>
            <a href="#">Productos</a>
            <a href="#">Contacto</a>
        </nav>

        <div class="redes-sociales">
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-tiktok"></i></a>
            <a href=""><i class="fa-brands fa-whatsapp"></i></a>
        </div>
    </header>

        <div class="contenedor">

            <h1>Contáctanos</h1>

            <form>

                <label for="nombres">Nombres:</label>
                <input type="text" id="nombres" name="nombres"
                        placeholder="Ingrese sus nombres" required>

                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" name="apellidos"
                        placeholder="Ingrese sus apellidos" required>

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo"
                        placeholder="Ingrese su correo" required>

                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono"
                        placeholder="Ingrese su teléfono" required>

                <label for="servicio">Seleccione un servicio:</label>
                <select id="servicio" name="servicio" required>
                    <option value="">-- Seleccione un servicio --</option>
                    <option value="Impulso Digital">Impulso Digital</option>
                    <option value="Acción Digital">Acción Digital</option>
                    <option value="Presencia Web">Presencia Web</option>
                    <option value="Consultoría de negocios">
                        Consultoría de negocios
                    </option>
                </select>

                <label for="comentarios">Comentarios:</label>
                <textarea id="comentarios" name="comentarios"
                            placeholder="Escriba sus comentarios"
                            rows="5"></textarea>

                <button type="submit">Enviar formulario</button>

            </form>

        </div>

    <footer>
        <h3>Gracias por su visita</h3>
        <p>© Todos los Derechos Reservados</p>
    </footer>
</body>
</html>
